<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- t2-quickshare-hotspot: only root runs the helper, every local user may
     call it; the helper itself starts the hotspot (which moves a Quick
     Share transfer from Bluetooth to Wi-Fi) only for root or the user with
     the active session. The hotspot ends when the caller leaves the bus. -->
<busconfig>
  <policy user="root">
    <allow own="org.t2airshare.QuickShareHotspot"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.t2airshare.QuickShareHotspot" send_interface="org.t2airshare.QuickShareHotspot1"/>
    <allow send_destination="org.t2airshare.QuickShareHotspot" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.t2airshare.QuickShareHotspot" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
